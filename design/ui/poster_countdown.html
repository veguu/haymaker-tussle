<!doctype html><meta charset="utf-8">
<!-- The round-start countdown's lettering (ui-16a), drawn by the browser exactly as the mockup's `.cd` draws it.
     TOP ROW, cells 256 x 400 in the order 3 2 1: Oswald 700 slanted at 250 px, an 11 px ink outline and a 13 px hard
     ink shadow, each in its own colour (3 cream, 2 yellow, 1 pink). Full colour: shown as they are, not tinted.
     Each number's own box (its width, 0.95 of its size tall) sits in the middle of its cell.
     SECOND ROW, from y = 400, cells 128 x 200 in the order T U S L E !: the TUSSLE! cards' letters, Oswald 700
     upright, WHITE on clear (tinted in the game), drawn at 160 px for the mockup's 128 (1.25 times), each in the
     middle of its cell.
     Capture:  python design/ui/mock_capture.py --clear --size 1024,600 --page design/ui/poster_countdown.html
               assets/icons/poster/countdown_sheet.png
     Widths:   python design/ui/mock_capture.py --dump design/ui/poster_countdown.html   (the RECT lines; they go
               into Ui/Shapes.count by hand) -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap">
<style>
html,body{margin:0;background:transparent;overflow:hidden}
.c{position:absolute;top:0;width:256px;height:400px;display:flex;align-items:center;justify-content:center}
.n{display:inline-block;font:700 250px/.95 Oswald;font-style:italic;-webkit-text-stroke:11px #43365A;paint-order:stroke fill;text-shadow:13px 13px 0 #43365A}
.g{position:absolute;top:400px;width:128px;height:200px;display:flex;align-items:center;justify-content:center}
.l{display:inline-block;font:700 160px/1 Oswald;color:#fff}
.m{position:absolute;left:0;top:700px;font:700 128px/1 Oswald;white-space:nowrap}
pre{position:absolute;left:0;top:900px;font:12px monospace}
</style>
<body>
<script>
const TONE={3:'#FFF9EC',2:'#FADF7F',1:'#F5A6C0'};
[3,2,1].forEach((d,i)=>{const c=document.createElement('div'); c.className='c'; c.style.left=(i*256)+'px';
  const n=document.createElement('span'); n.className='n'; n.style.color=TONE[d]; n.textContent=d; n.id='n'+d; c.appendChild(n); document.body.appendChild(c);});
const LETTERS=['T','U','S','L','E','!'];
LETTERS.forEach((ch,i)=>{const c=document.createElement('div'); c.className='g'; c.style.left=(i*128)+'px';
  const n=document.createElement('span'); n.className='l'; n.textContent=ch; c.appendChild(n); document.body.appendChild(c);
  const m=document.createElement('span'); m.className='m'; m.textContent=ch; m.id='m'+i; document.body.appendChild(m);});
document.fonts.load('italic 700 250px Oswald').then(()=>document.fonts.load('700 160px Oswald')).then(()=>document.fonts.ready).then(()=>{
  const pre=document.createElement('pre');
  pre.textContent='\nRECT boxes | '+[3,2,1].map(d=>{const e=document.getElementById('n'+d); return d+':'+e.offsetWidth+'x'+e.offsetHeight;}).join(' ')+
    '\nRECT letters128 | '+LETTERS.map((ch,i)=>ch+':'+document.getElementById('m'+i).getBoundingClientRect().width.toFixed(1)).join(' ')+'\n';
  document.body.appendChild(pre);
});
</script>
